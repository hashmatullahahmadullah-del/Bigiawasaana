<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV2 Menu — Bigi Awasaana</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: sans-serif;
    }
    #menu-img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
    #start-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #060606; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; color: white;
    }
    h1 { color: #ff4500; font-family: 'Arial Narrow', sans-serif; text-transform: uppercase; font-size: 4vw; }
    p { font-size: 1.5vw; opacity: 0.8; }
    /* Invisible base64 video loop to prevent TV sleep */
    #tv-nosleep {
      position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1>Tap Here To Start Display (TV2)</h1>
    <p>This activates fullscreen, starts music, and enables WakeLock to prevent sleep.</p>
  </div>

  <video id="tv-nosleep" playsinline muted loop src="data:video/webm;base64,GkXfo0AgQoaBAUL3gQFC8oEEQvOBCEKCQAR3ZWJtQoeBAkKFgQIYU4BnQAABZQUAAAAAAAAEAAABXgAAAs4T1kOIQnKGE8YBA4rIgEAAXwAAAwAAAwAAAAAYQoeBAkKFgQIYU4BnQAABZQUAAAAAAAAEAAABXgAAAs4="></video>
  <img id="menu-img" src="/tv2-menu.jpg" alt="TV2 Menu">

  <!-- Include NoSleep.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
  <script>
    document.getElementById('start-overlay').addEventListener('click', async () => {
      document.getElementById('start-overlay').style.display = 'none';
      
      // Request fullscreen
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(e => console.log(e));
      }

      // 1. Enable NoSleep.js fallback
      const noSleep = new NoSleep();
      noSleep.enable();

      // 2. Try modern Screen Wake Lock API
      if ('wakeLock' in navigator) {
        try {
          let wakeLock = await navigator.wakeLock.request('screen');
          // Re-acquire lock if visibility changes
          document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
              wakeLock = await navigator.wakeLock.request('screen');
            }
          });
        } catch (err) {
          console.log('Wake Lock error:', err);
        }
      }

      // 3. Play invisible base64 looping video
      const video = document.getElementById('tv-nosleep');
      if (video) {
        video.play().catch(err => console.error('Video play error:', err));
      }
    });

    // 4. Reload the page every 15 minutes. This clears memory and often resets 
    // aggressive TV OS sleep timers that ignore background videos.
    setTimeout(() => {
      window.location.reload();
    }, 15 * 60 * 1000);
  </script>
</body>
</html>
